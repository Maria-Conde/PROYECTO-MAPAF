# Ruta al Changelog Maestro XML
changeLogFile=db/changelog/db.changelog-master.xml

# Conexión JDBC a MariaDB / MySQL en XAMPP
url=jdbc:mysql://127.0.0.1:3306/mapaf_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
username=root
password=

# Driver JDBC
driver=com.mysql.cj.jdbc.Driver

# Parámetros Operacionales de Liquibase
liquibase.hub.mode=off
outputDefaultSchema=false
outputDefaultCatalog=false
logLevel=info
